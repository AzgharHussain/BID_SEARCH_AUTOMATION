services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gisfy_proposals_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./test.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/test.db:/app/test.db
      - ./backend/team_members.json:/app/team_members.json
      - ./backend/.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gisfy_proposals_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
